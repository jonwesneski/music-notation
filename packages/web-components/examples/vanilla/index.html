<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>music notation — vanilla example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <h1>A single staff</h1>
    <music-staff clef="treble" time="4/4">
      <music-note note="C" octave="5" duration="quarter"></music-note>
      <music-note note="E" octave="5" duration="quarter"></music-note>
      <music-note note="G" octave="5" duration="half"></music-note>
    </music-staff>

    <h1>A short composition</h1>
    <music-composition keysig="G" mode="major" time="4/4">
      <music-measure>
        <music-staff clef="treble">
          <music-note note="G" octave="4" duration="quarter"></music-note>
          <music-note note="B" octave="4" duration="quarter"></music-note>
          <music-note note="D" octave="5" duration="quarter"></music-note>
          <music-note note="G" octave="5" duration="quarter"></music-note>
        </music-staff>
      </music-measure>
    </music-composition>

    <!--
      Published: load from a CDN —
      <script type="module"
        src="https://cdn.jsdelivr.net/npm/@one-step-at-a-time/web-components/dist/standalone/music-notation.js"></script>
      Locally, point at the built bundle:
    -->
    <script
      type="module"
      src="../../dist/standalone/music-notation.js"
    ></script>
  </body>
</html>
